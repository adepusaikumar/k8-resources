apiVersion: v1
kind: Deployment
metadata:
  name: nginx-deployment
  # This labels are attached to deployment, wont affect pod behaviour
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
    component: frontend
  annotations:
    kubernetes.io/change-cause: "moving to 1.29.7"
spec:
  replicas: 2
  selector:
  # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: frontend
  template:
   # This is pod definition, pod is subset of replicaset
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.7

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    project: roboshop
    component: frontend
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80  # container port

