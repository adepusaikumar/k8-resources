apiVersion: v1
kind: Pod
metadata:
  name: vol-test-pod
spec:
  containers:
    - name: nginx-test
      image: nginx
      volumeMounts:
        - name : nginx-logs
          mountPath: /var/log/nginx
    - name: almalinux
      image: almalinux:9
      volumeMounts:
        - name: nginx-logs
          mountPath: /mnt/nginx-logs
          readOnly: true
      command: ["sleep", "2000"]
  volumes:
    - name: nginx-logs
      emptyDir:
        sizeLimit: 500Mi



